<section class="container nn-auth">
  <div class="nn-auth-card row g-0">
    <!-- Left banner -->
    <div
      class="col-lg-6 nn-auth-banner d-none d-lg-flex flex-column justify-content-between"
    >
      <div class="position-relative">
        <div class="d-flex align-items-center gap-3 mb-4">
          <img
            src="assets/images/logo.svg"
            alt="Nagar Nudge logo"
            width="56"
            height="56"
          />
          <div class="nn-auth-brand">Nagar<br />Nudge</div>
        </div>
        <h2 class="nn-auth-tagline">{{ "AUTH.BANNER.TAGLINE" | translate }}</h2>
      </div>

      <ul class="list-unstyled position-relative nn-auth-points mb-0">
        <li
          *ngFor="let point of bannerPoints"
          class="d-flex align-items-center gap-2 mb-2"
        >
          <i class="bi bi-check-circle-fill"></i>
          <span>{{ point | translate }}</span>
        </li>
      </ul>
    </div>

    <!-- Right form -->
    <div class="col-lg-6 p-4 p-md-5">
      <ul
        ngbNav
        #nav="ngbNav"
        [(activeId)]="activeTab"
        (activeIdChange)="onTabChange()"
        class="nav nav-tabs nn-auth-tabs"
      >
        <li [ngbNavItem]="'login'">
          <a ngbNavLink role="button">{{ "AUTH.TAB_LOGIN" | translate }}</a>
          <ng-template ngbNavContent>
            <app-login-form
              [prefillIdentifier]="prefillIdentifier"
              (switchToSignup)="activeTab = 'signup'"
            ></app-login-form>
          </ng-template>
        </li>

        <li [ngbNavItem]="'signup'">
          <a ngbNavLink role="button">{{ "AUTH.TAB_SIGNUP" | translate }}</a>
          <ng-template ngbNavContent>
            <app-signup-form
              (registered)="onRegistered($event)"
              (switchToLogin)="activeTab = 'login'"
            ></app-signup-form>
          </ng-template>
        </li>
      </ul>

      <div
        *ngIf="showSignupSuccess"
        class="alert alert-success py-2 small mt-3 mb-0"
      >
        {{ "AUTH.SIGNUP.SUCCESS" | translate }}
      </div>

      <div class="mt-4" [ngbNavOutlet]="nav"></div>
    </div>
  </div>
</section>
