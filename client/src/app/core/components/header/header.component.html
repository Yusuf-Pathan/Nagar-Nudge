<nav class="navbar navbar-expand-lg nn-navbar py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <img src="assets/images/logo.svg" alt="Nagar Nudge logo" width="48" height="48" />
      <span class="brand-text">Nagar<br />Nudge</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      [attr.aria-expanded]="!isMenuCollapsed"
      aria-controls="mainNav"
      (click)="isMenuCollapsed = !isMenuCollapsed"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="mainNav" class="collapse navbar-collapse" [ngbCollapse]="isMenuCollapsed">
      <ul class="navbar-nav mx-auto gap-lg-4 text-center">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            {{ 'NAV.HOME' | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="how-it-works">
            {{ 'NAV.HOW_IT_WORKS' | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/complaints/track">
            {{ 'NAV.TRACK' | translate }}
          </a>
        </li>
      </ul>

      <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-3">
        <!-- Language dropdown -->
        <div ngbDropdown class="nn-lang-dropdown">
          <button
            id="langDropdown"
            ngbDropdownToggle
            type="button"
            class="btn btn-outline-success btn-sm w-100"
          >
            <i class="bi bi-translate me-1"></i>{{ currentLabel }}
          </button>
          <div ngbDropdownMenu aria-labelledby="langDropdown">
            <button
              *ngFor="let lang of languages"
              ngbDropdownItem
              type="button"
              [class.active]="lang.code === currentLang"
              (click)="changeLanguage(lang.code)"
            >
              {{ lang.label }}
            </button>
          </div>
        </div>

        <a *ngIf="!authService.isLoggedIn()" routerLink="/auth/login" class="btn nn-btn-primary px-4 color-white">
          {{ 'NAV.LOGIN_SIGNUP' | translate }}
        </a>
        <button *ngIf="authService.isLoggedIn()" type="button" class="btn btn-outline-danger px-4" (click)="logout()">
          {{ 'NAV.LOGOUT' | translate }}
        </button>
      </div>
    </div>
  </div>
</nav>
