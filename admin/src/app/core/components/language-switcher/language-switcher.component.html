<div ngbDropdown class="nn-lang-dropdown">
  <button
    ngbDropdownToggle
    type="button"
    id="langDropdown"
    class="btn btn-outline-success btn-sm"
    aria-label="Change language"
  >
    <i class="bi bi-translate me-1"></i>{{ currentLabel }}
  </button>
  <div ngbDropdownMenu aria-labelledby="langDropdown">
    <button
      *ngFor="let lang of languages"
      ngbDropdownItem
      type="button"
      [class.active]="lang.code === currentLang"
      (click)="change(lang.code)"
    >
      {{ lang.label }}
    </button>
  </div>
</div>
