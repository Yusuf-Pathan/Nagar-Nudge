<div ngbDropdown class="nn-user-menu" placement="bottom-end">
  <button
    ngbDropdownToggle
    type="button"
    class="nn-avatar-btn"
    [attr.aria-label]="'Account menu'"
  >
    <span class="nn-avatar">{{ initial }}</span>
    <span class="nn-user-name d-none d-md-inline">{{ displayName }}</span>
    <i class="bi bi-chevron-down d-none d-md-inline ms-1"></i>
  </button>
  <div ngbDropdownMenu class="dropdown-menu-end">
    <div class="dropdown-item-text small text-secondary">{{ displayName }}</div>
    <button ngbDropdownItem type="button" (click)="logout()">
      <i class="bi bi-box-arrow-right me-2"></i>{{ 'NAV.LOGOUT' | translate }}
    </button>
  </div>
</div>
