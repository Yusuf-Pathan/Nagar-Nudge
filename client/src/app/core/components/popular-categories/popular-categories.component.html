<div class="nn-card h-100">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="nn-card-title mb-0">{{ 'CATEGORIES.TITLE' | translate }}</h3>
  </div>

  <div class="row g-3" *ngIf="categories$ | async as categories">
    <div class="col-4" *ngFor="let cat of categories">
      <div class="nn-category h-100">
        <div class="nn-category-icon" [ngClass]="cat.colorClass">
          <i class="bi {{ cat.icon }}"></i>
        </div>
        <span class="small fw-semibold">{{ cat.name }}</span>
      </div>
    </div>
  </div>
</div>
