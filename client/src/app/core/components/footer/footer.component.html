<footer class="nn-footer">
  <div class="container py-4">
    <div class="row align-items-center g-3">
      <div class="col-md-6 d-flex align-items-center gap-2">
        <img src="assets/images/logo.svg" alt="Nagar Nudge logo" width="40" height="40" />
        <div>
          <strong class="d-block text-success-emphasis">Nagar Nudge</strong>
          <small class="text-secondary">{{ 'FOOTER.TAGLINE' | translate }}</small>
        </div>
      </div>

      <div class="col-md-6 d-flex justify-content-md-end align-items-center gap-3">
        <a routerLink="/about" class="nn-footer-link">{{ 'FOOTER.ABOUT' | translate }}</a>
        <a
          [href]="instagramUrl"
          class="nn-social"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <i class="bi bi-instagram"></i>
        </a>
      </div>
    </div>

    <p class="text-center small text-secondary mt-4 mb-0">
      © {{ year }} Nagar Nudge. {{ 'FOOTER.RIGHTS' | translate }}
    </p>
  </div>
</footer>
