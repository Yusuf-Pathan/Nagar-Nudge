<div class="nn-shell">
  <header class="nn-topbar">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <img src="assets/images/logo.svg" alt="Nagar Nudge logo" width="44" height="44" />
      <span class="brand-text">Nagar<br />Nudge</span>
    </a>

    <div class="d-flex align-items-center gap-3">
      <button type="button" class="nn-bell" [attr.aria-label]="'APP.NOTIFICATIONS' | translate">
        <i class="bi bi-bell"></i>
        <span class="nn-bell-dot"></span>
      </button>

      <app-language-switcher></app-language-switcher>
      <app-user-menu></app-user-menu>
    </div>
  </header>

  <div class="nn-shell-body">
    <aside class="nn-sidebar">
      <nav class="nav flex-column gap-1">
        <a class="nav-link nn-side-link" routerLink="/complaints/new" routerLinkActive="active">
          <i class="bi bi-megaphone-fill"></i>{{ 'APP.SIDEBAR.RAISE' | translate }}
        </a>
        <a class="nav-link nn-side-link" routerLink="/complaints/my" routerLinkActive="active">
          <i class="bi bi-card-list"></i>{{ 'APP.SIDEBAR.MY' | translate }}
        </a>
        <a class="nav-link nn-side-link" routerLink="/profile" routerLinkActive="active">
          <i class="bi bi-person"></i>{{ 'APP.SIDEBAR.PROFILE' | translate }}
        </a>
      </nav>

      <button type="button" class="nav-link nn-side-link nn-side-logout mt-auto" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>{{ 'NAV.LOGOUT' | translate }}
      </button>
    </aside>

    <main class="nn-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
