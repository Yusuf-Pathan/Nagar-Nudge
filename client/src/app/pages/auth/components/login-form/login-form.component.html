<h3 class="fw-bold mb-1">{{ 'AUTH.LOGIN.TITLE' | translate }}</h3>
<p class="text-secondary small mb-4">{{ 'AUTH.LOGIN.SUBTITLE' | translate }}</p>

<div *ngIf="errorMessage" class="alert alert-danger py-2 small">{{ errorMessage }}</div>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>

  <!-- Mobile or email -->
  <div class="input-group nn-input mb-1">
    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
    <input
      type="text"
      class="form-control"
      formControlName="identifier"
      autocomplete="username"
      [placeholder]="'AUTH.LOGIN.IDENTIFIER' | translate"
      [class.is-invalid]="fieldError('identifier')"
    />
  </div>
  <small *ngIf="fieldError('identifier') as key" class="text-danger d-block mb-2">
    {{ key | translate }}
  </small>

  <!-- Password -->
  <div class="input-group nn-input mb-1 mt-2">
    <span class="input-group-text"><i class="bi bi-lock"></i></span>
    <input
      [type]="showPassword ? 'text' : 'password'"
      class="form-control"
      formControlName="password"
      autocomplete="current-password"
      [placeholder]="'AUTH.LOGIN.PASSWORD' | translate"
      [class.is-invalid]="fieldError('password')"
    />
    <button class="btn btn-outline-secondary" type="button" (click)="togglePassword()" [attr.aria-label]="'Toggle password'">
      <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
    </button>
  </div>
  <small *ngIf="fieldError('password') as key" class="text-danger d-block mb-2">
    {{ key | translate }}
  </small>

  <!-- Remember me and forgot password -->
  <div class="d-flex justify-content-between align-items-center my-3">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe" />
      <label class="form-check-label small" for="rememberMe">{{ 'AUTH.LOGIN.REMEMBER' | translate }}</label>
    </div>
    <a href="#" class="nn-link small fw-semibold">{{ 'AUTH.LOGIN.FORGOT' | translate }}</a>
  </div>

  <button type="submit" class="btn nn-btn-primary w-100 py-2" [disabled]="loading">
    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
    {{ 'AUTH.LOGIN.SUBMIT' | translate }}
  </button>
</form>

<p class="text-center small mt-4 mb-0">
  {{ 'AUTH.LOGIN.NO_ACCOUNT' | translate }}
  <a class="nn-link fw-semibold" role="button" (click)="switchToSignup.emit()">
    {{ 'AUTH.LOGIN.GO_SIGNUP' | translate }}
  </a>
</p>
