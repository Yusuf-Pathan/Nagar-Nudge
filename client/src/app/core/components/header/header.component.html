<nav class="navbar navbar-expand-lg nn-navbar py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <img
        src="assets/images/logo.svg"
        alt="Nagar Nudge logo"
        width="48"
        height="48"
      />
      <span class="brand-text">Nagar<br />Nudge</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      [attr.aria-expanded]="!isMenuCollapsed"
      aria-controls="mainNav"
      (click)="isMenuCollapsed = !isMenuCollapsed"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      id="mainNav"
      class="collapse navbar-collapse"
      [ngbCollapse]="isMenuCollapsed"
    >
      <ul class="navbar-nav mx-auto gap-lg-4 text-center">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ "NAV.HOME" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/" fragment="how-it-works">
            {{ "NAV.HOW_IT_WORKS" | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/complaints/new">
            {{ "NAV.TRACK" | translate }}
          </a>
        </li>
      </ul>

      <div
        class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-3"
      >
        <app-language-switcher></app-language-switcher>

        <a
          *ngIf="!authService.isLoggedIn()"
          routerLink="/auth/login"
          class="btn nn-btn-primary px-4"
        >
          {{ "NAV.LOGIN_SIGNUP" | translate }}
        </a>

        <app-user-menu *ngIf="authService.isLoggedIn()"></app-user-menu>
      </div>
    </div>
  </div>
</nav>
